<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ v.open }}" style="display:flex;flex-direction:column;gap:12px;cursor:pointer;min-width:0">
  <div style="position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:{{ v.thumbBg }};display:flex;align-items:flex-end;padding:12px" style-hover="transform:scale(1.015)">
    <span style="font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.02em;color:{{ v.thumbInk }};max-width:70%">{{ v.label }}</span>
    <span style="position:absolute;right:10px;bottom:10px;background:rgba(8,8,10,0.78);color:#f2f2f3;font-size:11.5px;font-weight:600;padding:3px 7px;border-radius:6px;font-family:'JetBrains Mono',monospace">{{ v.dur }}</span>
  </div>
  <div style="display:flex;gap:12px;align-items:flex-start">
    <div style="flex:none;width:36px;height:36px;border-radius:50%;background:{{ v.avatarBg }};color:#0e0f11;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ v.initials }}</div>
    <div style="display:flex;flex-direction:column;gap:4px;min-width:0">
      <div style="font-size:15px;font-weight:600;line-height:1.32;letter-spacing:-0.005em;text-wrap:pretty">{{ v.title }}</div>
      <div style="font-size:13px;color:var(--muted)">{{ v.channelName }} · {{ v.meta }}</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:290},&quot;v&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
